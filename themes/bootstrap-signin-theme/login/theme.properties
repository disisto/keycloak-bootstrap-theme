parent=base
import=common/keycloak
# Stylesheets and scripts are linked by template.ftl itself (with the ?v= cache-buster below), so
# no styles=/scripts= here.
locales=en,de,fr,es

# ===== LOGO =====
# A Bootstrap Icon id from sprite.ftl, drawn in a round badge in the primary colour ...
customLogoIcon=person-circle
customLogoAlt=Logo
# ... or an image instead (leave customLogoIcon unset). Size: .kc-logo in css/sign-in.css
# (a style attribute would break a strict CSP).
# customLogoUrl=https://example.com/logo.png

# ===== FAVICON =====
customFaviconPath=img/favicon.svg
# customFaviconUrl=https://example.com/favicon.ico

# ===== COPYRIGHT YEAR (footer) =====
# Options: none, current, range, hardcoded
copyrightYearMode=current
# range mode: start year (range = <start>-<current year>)
# copyrightStartYear=2020
# hardcoded mode: exact text
# copyrightYear=2020-2025

# ===== COPYRIGHT SIGNATURE (footer) =====
# Options: none, realm (realm display name), custom
copyrightSignatureMode=none
# custom mode:
# copyrightSignature=Your Company Name

# ===== CACHE-BUSTER =====
# Keycloak caches theme resources for 30 days. Bump this on every change under resources/ so
# browsers load the new files (?v=<assetVersion>).
assetVersion=1.0.0
